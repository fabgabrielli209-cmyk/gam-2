<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Slope Game</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .slope-game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000;
        }
        
        .slope-game-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
        }
        
        .slope-game-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .slope-controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            padding: 8px 16px;
            color: #fff;
            border-top: 2px solid #00ff88;
            font-size: 13px;
            flex-shrink: 0;
        }

        .slope-instructions {
            color: #a0a0a0;
        }

        .slope-instructions strong {
            color: #00ff88;
        }

        .slope-fullscreen-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .slope-fullscreen-btn:hover {
            background: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="slope-game-container">
        <div class="slope-game-wrapper">
            <iframe 
                id="slopeGameFrame"
                src="https://y8.com/embed/slope" 
                scrolling="no" 
                allowfullscreen="true"
                allow="autoplay; fullscreen; gamepad"
                loading="lazy">
            </iframe>
        </div>
        
        <div class="slope-controls-bar">
            <div class="slope-instructions">
                Controls: Use <strong>A / D</strong> or <strong>Left / Right Arrows</strong> to steer the ball!
            </div>
            <button class="slope-fullscreen-btn" onclick="openSlopeFullscreen()">🖵 Fullscreen</button>
        </div>
    </div>

    <script>
        function openSlopeFullscreen() {
            const gameFrame = document.getElementById('slopeGameFrame');
            if (gameFrame.requestFullscreen) {
                gameFrame.requestFullscreen();
            } else if (gameFrame.webkitRequestFullscreen) {
                gameFrame.webkitRequestFullscreen();
            } else if (gameFrame.msRequestFullscreen) {
                gameFrame.msRequestFullscreen();
            }
        }

        window.addEventListener('load', () => {
            const iframe = document.getElementById('slopeGameFrame');
            if (iframe) iframe.focus();
        });
    </script>

</body>
</html>
