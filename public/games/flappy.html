<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Wings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      background: #0284c7;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }
    .hud {
      position: absolute;
      top: 20px;
      display: flex;
      gap: 20px;
      pointer-events: none;
    }
    .score-badge {
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 16px;
      border-radius: 20px;
      font-family: monospace;
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .overlay h1 {
      font-size: 32px;
      font-weight: 800;
      color: #38bdf8;
    }
    .overlay p {
      font-size: 14px;
      color: #94a3b8;
    }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="game-container">
    <canvas id="canvas" width="360" height="500"></canvas>
    <div class="hud">
      <div class="score-badge" id="score-badge">0</div>
    </div>
    <div class="overlay" id="overlay">
      <h1 id="ov-title">FLAPPY WINGS</h1>
      <p id="ov-sub">Press Space or Tap to Flap</p>
      <button class="btn" id="start-btn">FLAP TO PLAY</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreBadge = document.getElementById('score-badge');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovSub = document.getElementById('ov-sub');
    const startBtn = document.getElementById('start-btn');

    let bird = { x: 60, y: 200, vy: 0, rad: 14, rot: 0 };
    let pipes = [];
    let clouds = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    let isPlaying = false;
    let frame = 0;

    const GRAVITY = 0.35;
    const JUMP = -6.5;
    const PIPE_SPEED = 2;
    const PIPE_GAP = 125;
    const PIPE_SPAWN_RATE = 90;

    // Web Audio Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, dur) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function init() {
      bird = { x: 60, y: 220, vy: 0, rad: 14, rot: 0 };
      pipes = [];
      score = 0;
      frame = 0;
      scoreBadge.textContent = '0';
      isPlaying = true;
      overlay.style.display = 'none';

      // generate initial clouds
      clouds = [
        { x: 50, y: 60, s: 0.8 },
        { x: 220, y: 110, s: 1.2 },
        { x: 320, y: 40, s: 0.6 }
      ];
    }

    function flap() {
      if (!isPlaying) {
        init();
        return;
      }
      bird.vy = JUMP;
      playSound(400, 'triangle', 0.08);
    }

    function spawnPipe() {
      const minTop = 60;
      const maxTop = canvas.height - PIPE_GAP - 120;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + PIPE_GAP,
        width: 52,
        passed: false
      });
    }

    function gameOver() {
      isPlaying = false;
      playSound(140, 'sawtooth', 0.3);
      if (score > best) {
        best = score;
        localStorage.setItem('flappy_best', best.toString());
      }
      ovTitle.textContent = 'GAME OVER';
      ovSub.textContent = `Score: ${score} · Best: ${best}`;
      startBtn.textContent = 'TRY AGAIN';
      overlay.style.display = 'flex';
    }

    function update() {
      if (!isPlaying) return;
      frame++;

      // Bird Physics
      bird.vy += GRAVITY;
      bird.y += bird.vy;
      bird.rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, bird.vy * 0.08));

      // Floor & Ceiling collision
      if (bird.y + bird.rad >= canvas.height - 30) {
        gameOver();
        return;
      }
      if (bird.y - bird.rad <= 0) {
        bird.y = bird.rad;
        bird.vy = 0;
      }

      // Pipes
      if (frame % PIPE_SPAWN_RATE === 0) spawnPipe();

      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPEED;

        // Collision Check
        if (
          bird.x + bird.rad > p.x &&
          bird.x - bird.rad < p.x + p.width
        ) {
          if (bird.y - bird.rad < p.top || bird.y + bird.rad > p.bottom) {
            gameOver();
            return;
          }
        }

        // Passed pipe
        if (!p.passed && p.x + p.width < bird.x) {
          p.passed = true;
          score++;
          scoreBadge.textContent = score;
          playSound(600, 'sine', 0.1);
        }

        if (p.x + p.width < -10) {
          pipes.splice(i, 1);
        }
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= 0.5 * c.s;
        if (c.x < -60) c.x = canvas.width + 40;
      });
    }

    function draw() {
      // Sky gradient
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#38bdf8');
      grad.addColorStop(0.7, '#bae6fd');
      grad.addColorStop(1, '#6ee7b7');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 22 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 18 * c.s, c.y - 6 * c.s, 26 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 36 * c.s, c.y, 20 * c.s, 0, Math.PI * 2);
        ctx.fill();
      });

      // Pipes
      pipes.forEach(p => {
        // Top Pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, 0, p.width, p.top);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 3, p.top - 18, p.width + 6, 18);

        // Bottom Pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, p.bottom, p.width, canvas.height - p.bottom - 30);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 3, p.bottom, p.width + 6, 18);
      });

      // Ground
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 6);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rot);

      // Bird body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, bird.rad, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(5, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(6, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(11, -2);
      ctx.lineTo(19, 1);
      ctx.lineTo(11, 4);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
      if (e.code === 'KeyR') {
        init();
      }
    });

    canvas.addEventListener('click', flap);
    startBtn.addEventListener('click', flap);

    // Initial draw
    init();
    isPlaying = false;
    overlay.style.display = 'flex';
    loop();
  </script>
</body>
</html>
