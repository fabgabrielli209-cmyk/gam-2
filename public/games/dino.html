<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Desert Dino Run</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 600px;
      width: 100%;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .stat {
      background: #1e293b;
      padding: 4px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .stat span {
      color: #38bdf8;
      font-family: monospace;
      font-size: 16px;
      margin-left: 6px;
    }
    canvas {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      cursor: pointer;
    }
    .overlay {
      position: absolute;
      top: 40px;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }
    .overlay h2 { font-size: 28px; font-weight: 800; color: #38bdf8; }
    .overlay p { font-size: 14px; color: #94a3b8; }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="hud">
      <div class="stat">SCORE <span id="score">00000</span></div>
      <div class="stat">HI-SCORE <span id="best">00000</span></div>
    </div>

    <canvas id="canvas" width="580" height="240"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="ov-title">DESERT DINO RUN</h2>
      <p id="ov-desc">Space / Up: Jump · Down: Duck</p>
      <button class="btn" id="start-btn">START RUN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const startBtn = document.getElementById('start-btn');

    let dino = { x: 50, y: 175, w: 26, h: 42, vy: 0, isJumping: false, isDucking: false };
    let obstacles = [];
    let clouds = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('dino_best') || '0', 10);
    bestEl.textContent = String(best).padStart(5, '0');
    let speed = 6;
    let isPlaying = false;
    let frame = 0;
    let nextObstacleTimer = 0;

    const GROUND_Y = 210;
    const GRAVITY = 0.65;

    // Web Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, dur) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function init() {
      dino = { x: 50, y: GROUND_Y - 42, w: 26, h: 42, vy: 0, isJumping: false, isDucking: false };
      obstacles = [];
      score = 0;
      speed = 6;
      frame = 0;
      nextObstacleTimer = 60;
      clouds = [
        { x: 120, y: 50 },
        { x: 380, y: 30 },
        { x: 520, y: 65 }
      ];
      isPlaying = true;
      overlay.style.display = 'none';
    }

    function jump() {
      if (!isPlaying) { init(); return; }
      if (!dino.isJumping) {
        dino.vy = -12.5;
        dino.isJumping = true;
        playTone(550, 0.08);
      }
    }

    function duck(isDucking) {
      if (!isPlaying) return;
      dino.isDucking = isDucking;
      if (isDucking) {
        dino.h = 24;
        dino.y = GROUND_Y - 24;
      } else {
        dino.h = 42;
        if (!dino.isJumping) dino.y = GROUND_Y - 42;
      }
    }

    function update() {
      if (!isPlaying) return;
      frame++;
      score += 0.2;
      scoreEl.textContent = String(Math.floor(score)).padStart(5, '0');
      speed = 6 + Math.floor(score / 200) * 0.5;

      // Dino Physics
      if (dino.isJumping) {
        dino.vy += GRAVITY;
        dino.y += dino.vy;
        if (dino.y >= GROUND_Y - dino.h) {
          dino.y = GROUND_Y - dino.h;
          dino.vy = 0;
          dino.isJumping = false;
        }
      }

      // Obstacle Spawning
      nextObstacleTimer--;
      if (nextObstacleTimer <= 0) {
        const isBird = Math.random() < 0.3 && score > 150;
        if (isBird) {
          obstacles.push({
            x: canvas.width,
            y: Math.random() < 0.5 ? GROUND_Y - 32 : GROUND_Y - 55,
            w: 30,
            h: 20,
            type: 'bird'
          });
        } else {
          const type = Math.random() < 0.5 ? 'single' : 'double';
          obstacles.push({
            x: canvas.width,
            y: GROUND_Y - (type === 'single' ? 36 : 42),
            w: type === 'single' ? 18 : 34,
            h: type === 'single' ? 36 : 42,
            type: 'cactus'
          });
        }
        nextObstacleTimer = Math.floor(Math.random() * 50) + Math.max(45, 90 - Math.floor(score / 50));
      }

      // Obstacles update & collision
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision Check (AABB with inner margin)
        const margin = 5;
        if (
          dino.x + margin < obs.x + obs.w - margin &&
          dino.x + dino.w - margin > obs.x + margin &&
          dino.y + margin < obs.y + obs.h - margin &&
          dino.y + dino.h - margin > obs.y + margin
        ) {
          gameOver();
          return;
        }

        if (obs.x + obs.w < -20) obstacles.splice(i, 1);
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= speed * 0.2;
        if (c.x < -60) c.x = canvas.width + 40;
      });
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#334155';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
        ctx.arc(c.x + 12, c.y - 4, 18, 0, Math.PI * 2);
        ctx.arc(c.x + 24, c.y, 12, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground Line
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      // Ground specs
      ctx.fillStyle = '#64748b';
      for (let i = 0; i < 15; i++) {
        const gx = ((frame * speed + i * 45) % canvas.width);
        ctx.fillRect(canvas.width - gx, GROUND_Y + 6 + (i % 3) * 4, 3, 2);
      }

      // Dino
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(dino.x, dino.y, dino.w, dino.h, 4);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(dino.x + (dino.isDucking ? 20 : 16), dino.y + 4, 3, 3);

      // Obstacles
      obstacles.forEach(obs => {
        if (obs.type === 'cactus') {
          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 3);
          ctx.fill();
        } else {
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.ellipse(obs.x + obs.w/2, obs.y + obs.h/2, obs.w/2, obs.h/2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isPlaying = false;
      playTone(180, 0.3);
      const finalScore = Math.floor(score);
      if (finalScore > best) {
        best = finalScore;
        localStorage.setItem('dino_best', best.toString());
        bestEl.textContent = String(best).padStart(5, '0');
      }
      ovTitle.textContent = 'GAME OVER';
      ovDesc.textContent = `Score: ${finalScore} · Best: ${best}`;
      startBtn.textContent = 'RUN AGAIN';
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        jump();
      }
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        duck(true);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        duck(false);
      }
    });

    canvas.addEventListener('click', jump);
    startBtn.addEventListener('click', init);

    init();
    isPlaying = false;
    overlay.style.display = 'flex';
    loop();
  </script>
</body>
</html>
