<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Highway Rush 2D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 440px;
      width: 100%;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .stat {
      background: #1e293b;
      padding: 4px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .stat span {
      color: #38bdf8;
      font-family: monospace;
      font-size: 16px;
      margin-left: 6px;
    }
    canvas {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .overlay {
      position: absolute;
      top: 40px;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(4px);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }
    .overlay h2 { font-size: 28px; font-weight: 800; color: #38bdf8; }
    .overlay p { font-size: 13px; color: #94a3b8; }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .mobile-controls {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      width: 100%;
      justify-content: center;
    }
    .m-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 700;
      user-select: none;
    }
    .m-btn:active { background: #38bdf8; color: #000; }
    @media (min-width: 500px) {
      .mobile-controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="hud">
      <div class="stat">SCORE <span id="score">0</span></div>
      <div class="stat">COINS <span id="coins">0</span></div>
      <div class="stat">SPEED <span id="speed">120 MPH</span></div>
    </div>

    <canvas id="canvas" width="380" height="480"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="ov-title">HIGHWAY RUSH 2D</h2>
      <p id="ov-desc">Left / Right / A / D: Steer<br>Up / W: Nitro Boost<br>Dodge traffic & collect coins!</p>
      <button class="btn" id="start-btn">IGNITION START</button>
    </div>

    <div class="mobile-controls">
      <div class="m-btn" id="m-left">◀</div>
      <div class="m-btn" id="m-nitro">⚡ NITRO</div>
      <div class="m-btn" id="m-right">▶</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const coinsEl = document.getElementById('coins');
    const speedEl = document.getElementById('speed');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const startBtn = document.getElementById('start-btn');

    const LANES = [80, 150, 220, 290];
    let player = { lane: 1, x: 150, y: 380, w: 34, h: 62, targetX: 150 };
    let traffic = [];
    let coins = [];
    let roadOffset = 0;
    let score = 0;
    let coinCount = 0;
    let isPlaying = false;
    let isNitro = false;
    let baseSpeed = 5;

    // Web Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, dur) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function init() {
      player.lane = 1;
      player.targetX = LANES[1];
      player.x = LANES[1];
      traffic = [];
      coins = [];
      score = 0;
      coinCount = 0;
      scoreEl.textContent = '0';
      coinsEl.textContent = '0';
      isPlaying = true;
      isNitro = false;
      overlay.style.display = 'none';
    }

    function changeLane(dir) {
      if (!isPlaying) return;
      player.lane = Math.max(0, Math.min(LANES.length - 1, player.lane + dir));
      player.targetX = LANES[player.lane];
      playBeep(320, 'sine', 0.04);
    }

    function spawnTraffic() {
      const lane = Math.floor(Math.random() * LANES.length);
      const colors = ['#ef4444', '#eab308', '#22c55e', '#a855f7', '#64748b'];
      traffic.push({
        x: LANES[lane],
        y: -80,
        w: 32,
        h: 58,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: Math.random() * 2 + 1.5
      });
    }

    function spawnCoin() {
      const lane = Math.floor(Math.random() * LANES.length);
      coins.push({
        x: LANES[lane],
        y: -30,
        r: 8
      });
    }

    function update() {
      if (!isPlaying) return;

      const currentSpeed = isNitro ? baseSpeed * 1.8 : baseSpeed;
      speedEl.textContent = `${Math.floor(currentSpeed * 20)} MPH`;
      score += Math.floor(currentSpeed);
      scoreEl.textContent = score;

      // Move player towards targetX smoothly
      player.x += (player.targetX - player.x) * 0.25;

      // Scroll road
      roadOffset = (roadOffset + currentSpeed) % 40;

      // Spawn traffic
      if (Math.random() < 0.025) spawnTraffic();
      if (Math.random() < 0.03) spawnCoin();

      // Update traffic
      for (let i = traffic.length - 1; i >= 0; i--) {
        const car = traffic[i];
        car.y += (currentSpeed - car.speed);

        // Collision Check
        if (
          Math.abs(player.x - car.x) < 26 &&
          Math.abs(player.y - car.y) < 50
        ) {
          gameOver();
          return;
        }

        if (car.y > canvas.height + 100) traffic.splice(i, 1);
      }

      // Update coins
      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.y += currentSpeed;

        if (
          Math.abs(player.x - c.x) < 22 &&
          Math.abs(player.y - c.y) < 36
        ) {
          coinCount++;
          coinsEl.textContent = coinCount;
          playBeep(780, 'triangle', 0.08);
          coins.splice(i, 1);
          continue;
        }

        if (c.y > canvas.height + 20) coins.splice(i, 1);
      }
    }

    function draw() {
      // Grass / Shoulders
      ctx.fillStyle = '#064e3b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Asphalt Road
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(40, 0, canvas.width - 80, canvas.height);

      // Road curbs
      ctx.fillStyle = '#ef4444';
      for (let y = -40 + roadOffset; y < canvas.height; y += 40) {
        ctx.fillRect(36, y, 4, 20);
        ctx.fillRect(canvas.width - 40, y, 4, 20);
      }
      ctx.fillStyle = '#ffffff';
      for (let y = -40 + roadOffset; y < canvas.height; y += 40) {
        ctx.fillRect(36, y + 20, 4, 20);
        ctx.fillRect(canvas.width - 40, y + 20, 4, 20);
      }

      // Lane dividers
      ctx.fillStyle = '#facc15';
      [115, 185, 255].forEach(lx => {
        for (let y = -40 + roadOffset; y < canvas.height; y += 40) {
          ctx.fillRect(lx, y, 3, 20);
        }
      });

      // Coins
      ctx.fillStyle = '#eab308';
      ctx.shadowColor = '#eab308';
      ctx.shadowBlur = 8;
      coins.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Traffic Cars
      traffic.forEach(car => {
        ctx.fillStyle = car.color;
        ctx.beginPath();
        ctx.roundRect(car.x - car.w/2, car.y - car.h/2, car.w, car.h, 6);
        ctx.fill();

        // Windshield
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(car.x - car.w/2 + 4, car.y - car.h/2 + 10, car.w - 8, 12);
        ctx.fillRect(car.x - car.w/2 + 4, car.y + car.h/2 - 16, car.w - 8, 8);
      });

      // Player Car
      ctx.fillStyle = isNitro ? '#38bdf8' : '#0284c7';
      if (isNitro) {
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 15;
      }
      ctx.beginPath();
      ctx.roundRect(player.x - player.w/2, player.y - player.h/2, player.w, player.h, 6);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Player Windshields & Tail lights
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(player.x - player.w/2 + 4, player.y - player.h/2 + 12, player.w - 8, 14);
      ctx.fillRect(player.x - player.w/2 + 4, player.y + player.h/2 - 18, player.w - 8, 8);

      // Tail lights
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(player.x - player.w/2 + 4, player.y + player.h/2 - 4, 6, 3);
      ctx.fillRect(player.x + player.w/2 - 10, player.y + player.h/2 - 4, 6, 3);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isPlaying = false;
      playBeep(130, 'sawtooth', 0.4);
      ovTitle.textContent = 'CRASHED!';
      ovDesc.textContent = `Score: ${score} · Coins: ${coinCount}`;
      startBtn.textContent = 'RACE AGAIN';
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
      if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') isNitro = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') isNitro = false;
    });

    startBtn.addEventListener('click', init);

    document.getElementById('m-left').addEventListener('click', () => changeLane(-1));
    document.getElementById('m-right').addEventListener('click', () => changeLane(1));
    const nitroBtn = document.getElementById('m-nitro');
    nitroBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isNitro = true; });
    nitroBtn.addEventListener('touchend', (e) => { e.preventDefault(); isNitro = false; });

    init();
    isPlaying = false;
    overlay.style.display = 'flex';
    loop();
  </script>
</body>
</html>
