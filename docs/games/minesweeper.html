<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .container {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-width: 95vw;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #1e293b;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .digital-lcd {
      background: #090d16;
      border: 1px solid #1e293b;
      color: #ef4444;
      font-family: monospace;
      font-size: 22px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      min-width: 55px;
      text-align: center;
    }
    .smiley-btn {
      background: #334155;
      border: 2px solid #475569;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .smiley-btn:active { transform: scale(0.95); }
    .grid {
      display: grid;
      grid-gap: 2px;
      background: #1e293b;
      padding: 4px;
      border-radius: 6px;
      user-select: none;
    }
    .cell {
      width: 30px;
      height: 30px;
      background: #334155;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }
    .cell:hover:not(.revealed) { background: #475569; }
    .cell.revealed {
      background: #0f172a;
      cursor: default;
    }
    .cell.mine { background: #ef4444; color: #fff; }
    .diff-select {
      display: flex;
      gap: 6px;
    }
    .diff-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .diff-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .flag-mode-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .flag-mode-btn.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }

    /* Cell colors */
    .c-1 { color: #38bdf8; }
    .c-2 { color: #22c55e; }
    .c-3 { color: #ef4444; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #f97316; }
    .c-6 { color: #06b6d4; }
    .c-7 { color: #ec4899; }
    .c-8 { color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="diff-select">
      <button class="diff-btn active" id="diff-easy">9x9 (10)</button>
      <button class="diff-btn" id="diff-med">16x16 (40)</button>
      <button class="flag-mode-btn" id="flag-toggle">🚩 Mode: Off</button>
    </div>

    <div class="header-bar">
      <div class="digital-lcd" id="mines-count">010</div>
      <div class="smiley-btn" id="smiley">🙂</div>
      <div class="digital-lcd" id="timer">000</div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const minesEl = document.getElementById('mines-count');
    const timerEl = document.getElementById('timer');
    const smiley = document.getElementById('smiley');
    const flagToggle = document.getElementById('flag-toggle');

    let rows = 9;
    let cols = 9;
    let minesTotal = 10;
    let board = [];
    let isGameOver = false;
    let isFirstClick = true;
    let flagMode = false;
    let timer = 0;
    let timerInterval = null;

    // Web Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, dur) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function initGame() {
      clearInterval(timerInterval);
      timer = 0;
      timerEl.textContent = '000';
      isGameOver = false;
      isFirstClick = true;
      smiley.textContent = '🙂';
      minesEl.textContent = String(minesTotal).padStart(3, '0');

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
      board = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          row.push({
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0
          });
        }
        board.push(row);
      }
      render();
    }

    function placeMines(safeR, safeC) {
      let placed = 0;
      while (placed < minesTotal) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if (!board[r][c].mine && !(r === safeR && c === safeC)) {
          board[r][c].mine = true;
          placed++;
        }
      }

      // Count neighbors
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!board[r][c].mine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) {
                  count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }
    }

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = board[r][c];
          const div = document.createElement('div');
          div.className = 'cell';
          if (cell.revealed) {
            div.classList.add('revealed');
            if (cell.mine) {
              div.classList.add('mine');
              div.textContent = '💣';
            } else if (cell.count > 0) {
              div.textContent = cell.count;
              div.classList.add(`c-${cell.count}`);
            }
          } else if (cell.flagged) {
            div.textContent = '🚩';
          }

          div.addEventListener('click', () => handleCellClick(r, c));
          div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          gridEl.appendChild(div);
        }
      }
    }

    function handleCellClick(r, c) {
      if (isGameOver) return;
      if (flagMode) {
        toggleFlag(r, c);
        return;
      }

      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (isFirstClick) {
        isFirstClick = false;
        placeMines(r, c);
        timerInterval = setInterval(() => {
          timer = Math.min(999, timer + 1);
          timerEl.textContent = String(timer).padStart(3, '0');
        }, 1000);
      }

      if (cell.mine) {
        // Game Over
        cell.revealed = true;
        isGameOver = true;
        clearInterval(timerInterval);
        smiley.textContent = '😵';
        playTone(150, 0.35);
        // Reveal all mines
        board.forEach(row => row.forEach(cl => { if (cl.mine) cl.revealed = true; }));
        render();
        return;
      }

      playTone(400, 0.04);
      revealCell(r, c);
      render();
      checkWin();
    }

    function revealCell(r, c) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged || cell.mine) return;

      cell.revealed = true;
      if (cell.count === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            revealCell(r + dr, c + dc);
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (isGameOver) return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      playTone(550, 0.04);
      const flaggedCount = board.flat().filter(cl => cl.flagged).length;
      minesEl.textContent = String(Math.max(0, minesTotal - flaggedCount)).padStart(3, '0');
      render();
      checkWin();
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!board[r][c].mine && !board[r][c].revealed) {
            unrevealedSafe++;
          }
        }
      }
      if (unrevealedSafe === 0) {
        isGameOver = true;
        clearInterval(timerInterval);
        smiley.textContent = '😎';
        playTone(750, 0.3);
      }
    }

    smiley.addEventListener('click', initGame);

    flagToggle.addEventListener('click', () => {
      flagMode = !flagMode;
      flagToggle.textContent = flagMode ? '🚩 Mode: ON' : '🚩 Mode: Off';
      flagToggle.classList.toggle('active', flagMode);
    });

    document.getElementById('diff-easy').addEventListener('click', function() {
      rows = 9; cols = 9; minesTotal = 10;
      this.classList.add('active');
      document.getElementById('diff-med').classList.remove('active');
      initGame();
    });

    document.getElementById('diff-med').addEventListener('click', function() {
      rows = 16; cols = 16; minesTotal = 40;
      this.classList.add('active');
      document.getElementById('diff-easy').classList.remove('active');
      initGame();
    });

    initGame();
  </script>
</body>
</html>
