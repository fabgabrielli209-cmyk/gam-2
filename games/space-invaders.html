<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Star Defender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 480px;
      width: 100%;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .stat {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .stat span {
      color: #38bdf8;
      font-family: monospace;
      font-size: 16px;
      margin-left: 6px;
    }
    canvas {
      background: #050814;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .overlay {
      position: absolute;
      top: 45px;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(5, 8, 20, 0.9);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
    }
    .overlay h2 { font-size: 28px; font-weight: 800; color: #38bdf8; }
    .overlay p { font-size: 14px; color: #94a3b8; }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .touch-bar {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      width: 100%;
      justify-content: center;
    }
    .t-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      user-select: none;
    }
    .t-btn:active { background: #38bdf8; color: #000; }
    @media (min-width: 600px) {
      .touch-bar { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="hud">
      <div class="stat">SCORE <span id="score">0</span></div>
      <div class="stat">LIVES <span id="lives">3</span></div>
      <div class="stat">WAVE <span id="wave">1</span></div>
    </div>
    <canvas id="canvas" width="440" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">STAR DEFENDER</h2>
      <p id="ov-desc">Left / Right / A / D: Move Cannon<br>Space: Fire Blasters</p>
      <button class="btn" id="start-btn">START DEFENSE</button>
    </div>
    <div class="touch-bar">
      <div class="t-btn" id="t-left">◀</div>
      <div class="t-btn" id="t-fire">🔥 FIRE</div>
      <div class="t-btn" id="t-right">▶</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const waveEl = document.getElementById('wave');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const startBtn = document.getElementById('start-btn');

    let player = { x: 200, y: 440, w: 32, h: 20, speed: 4 };
    let bullets = [];
    let enemyBullets = [];
    let aliens = [];
    let shields = [];
    let stars = [];
    let ufo = null;
    let alienDir = 1;
    let alienSpeed = 0.8;
    let score = 0;
    let lives = 3;
    let wave = 1;
    let isPlaying = false;
    let keys = {};

    // Web Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, dur) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    // Init Stars
    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        s: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.5 + 0.2
      });
    }

    function initAliens() {
      aliens = [];
      const rows = 4;
      const cols = 8;
      const startX = 35;
      const startY = 40;
      const spacingX = 46;
      const spacingY = 32;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: startX + c * spacingX,
            y: startY + r * spacingY,
            w: 26,
            h: 18,
            type: r, // 0 = top, 1,2 = mid, 3 = bottom
            alive: true
          });
        }
      }
      alienDir = 1;
      alienSpeed = 0.7 + wave * 0.2;
    }

    function initShields() {
      shields = [];
      const shieldCount = 3;
      const spacing = canvas.width / (shieldCount + 1);
      for (let i = 1; i <= shieldCount; i++) {
        shields.push({
          x: i * spacing - 24,
          y: 380,
          w: 48,
          h: 24,
          hp: 8
        });
      }
    }

    function init() {
      score = 0;
      lives = 3;
      wave = 1;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      waveEl.textContent = '1';
      bullets = [];
      enemyBullets = [];
      ufo = null;
      player.x = canvas.width / 2 - player.w / 2;
      initAliens();
      initShields();
      isPlaying = true;
      overlay.style.display = 'none';
    }

    function fireBullet() {
      if (bullets.length < 2) {
        bullets.push({
          x: player.x + player.w / 2 - 2,
          y: player.y - 6,
          w: 4,
          h: 12
        });
        playTone(720, 'square', 0.05);
      }
    }

    function update() {
      if (!isPlaying) return;

      // Move Stars
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
      });

      // Player Movement
      if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 10) player.x -= player.speed;
      if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.w - 10) player.x += player.speed;

      // Player Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= 7;

        // Check Shield Hit
        shields.forEach(s => {
          if (s.hp > 0 && b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
            s.hp--;
            bullets.splice(i, 1);
          }
        });

        // Check UFO Hit
        if (ufo && b.x > ufo.x && b.x < ufo.x + ufo.w && b.y > ufo.y && b.y < ufo.y + ufo.h) {
          score += 200;
          scoreEl.textContent = score;
          playTone(880, 'triangle', 0.15);
          ufo = null;
          bullets.splice(i, 1);
          continue;
        }

        // Check Alien Hit
        for (let j = 0; j < aliens.length; j++) {
          const a = aliens[j];
          if (a.alive && b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
            a.alive = false;
            bullets.splice(i, 1);
            score += (4 - a.type) * 25;
            scoreEl.textContent = score;
            playTone(400, 'sine', 0.07);
            break;
          }
        }

        if (b && b.y < -10) bullets.splice(i, 1);
      }

      // Move Aliens
      let hitEdge = false;
      const liveAliens = aliens.filter(a => a.alive);

      liveAliens.forEach(a => {
        if ((alienDir === 1 && a.x + a.w > canvas.width - 15) || (alienDir === -1 && a.x < 15)) {
          hitEdge = true;
        }
      });

      if (hitEdge) {
        alienDir *= -1;
        liveAliens.forEach(a => { a.y += 14; });
      } else {
        liveAliens.forEach(a => { a.x += alienDir * alienSpeed; });
      }

      // Alien Shooting
      if (Math.random() < 0.035 && liveAliens.length > 0) {
        const shooter = liveAliens[Math.floor(Math.random() * liveAliens.length)];
        enemyBullets.push({
          x: shooter.x + shooter.w / 2,
          y: shooter.y + shooter.h,
          w: 3,
          h: 10
        });
      }

      // Enemy Bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.y += 4;

        // Hit Shields
        shields.forEach(s => {
          if (s.hp > 0 && eb.x > s.x && eb.x < s.x + s.w && eb.y > s.y && eb.y < s.y + s.h) {
            s.hp--;
            enemyBullets.splice(i, 1);
          }
        });

        // Hit Player
        if (
          eb.x > player.x && eb.x < player.x + player.w &&
          eb.y > player.y && eb.y < player.y + player.h
        ) {
          enemyBullets.splice(i, 1);
          lives--;
          livesEl.textContent = lives;
          playTone(160, 'sawtooth', 0.25);
          if (lives <= 0) {
            gameOver();
            return;
          }
        }

        if (eb.y > canvas.height + 10) enemyBullets.splice(i, 1);
      }

      // UFO Spawn
      if (!ufo && Math.random() < 0.002) {
        ufo = { x: -40, y: 18, w: 40, h: 16, speed: 2 };
      }
      if (ufo) {
        ufo.x += ufo.speed;
        if (ufo.x > canvas.width + 50) ufo = null;
      }

      // Wave Cleared
      if (liveAliens.length === 0) {
        wave++;
        waveEl.textContent = wave;
        playTone(660, 'sine', 0.2);
        initAliens();
      }

      // Aliens reached bottom
      if (liveAliens.some(a => a.y + a.h >= player.y)) {
        gameOver();
      }
    }

    function draw() {
      ctx.fillStyle = '#050814';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#94a3b8';
      stars.forEach(s => {
        ctx.fillRect(s.x, s.y, s.s, s.s);
      });

      // Player Cannon
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.x, player.y + 8, player.w, player.h - 8);
      ctx.fillRect(player.x + player.w / 2 - 4, player.y, 8, 8);

      // Shields
      shields.forEach(s => {
        if (s.hp > 0) {
          ctx.fillStyle = `rgba(34, 197, 94, ${s.hp / 8})`;
          ctx.fillRect(s.x, s.y, s.w, s.h);
        }
      });

      // Aliens
      aliens.forEach(a => {
        if (a.alive) {
          ctx.fillStyle = a.type === 0 ? '#ec4899' : a.type === 1 ? '#a855f7' : a.type === 2 ? '#06b6d4' : '#22c55e';
          ctx.beginPath();
          ctx.roundRect(a.x, a.y, a.w, a.h, 4);
          ctx.fill();
        }
      });

      // UFO
      if (ufo) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.ellipse(ufo.x + ufo.w / 2, ufo.y + ufo.h / 2, ufo.w / 2, ufo.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Bullets
      ctx.fillStyle = '#facc15';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      ctx.fillStyle = '#ef4444';
      enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isPlaying = false;
      ovTitle.textContent = 'MISSION FAILED';
      ovDesc.textContent = `Score: ${score} · Wave reached: ${wave}`;
      startBtn.textContent = 'DEPLOY AGAIN';
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        if (isPlaying) fireBullet();
        else init();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    startBtn.addEventListener('click', init);

    document.getElementById('t-left').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
    document.getElementById('t-left').addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowLeft'] = false; });
    document.getElementById('t-right').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
    document.getElementById('t-right').addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowRight'] = false; });
    document.getElementById('t-fire').addEventListener('touchstart', (e) => { e.preventDefault(); fireBullet(); });

    init();
    isPlaying = false;
    overlay.style.display = 'flex';
    loop();
  </script>
</body>
</html>
