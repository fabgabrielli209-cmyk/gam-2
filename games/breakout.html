<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 500px;
      width: 100%;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .stat {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .stat span {
      color: #38bdf8;
      font-family: monospace;
      font-size: 16px;
      margin-left: 6px;
    }
    canvas {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      cursor: crosshair;
    }
    .overlay {
      position: absolute;
      top: 45px;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(4px);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .overlay h2 { font-size: 28px; font-weight: 800; color: #38bdf8; }
    .overlay p { font-size: 14px; color: #94a3b8; }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="hud">
      <div class="stat">SCORE <span id="score">0</span></div>
      <div class="stat">LIVES <span id="lives">3</span></div>
      <div class="stat">LEVEL <span id="level">1</span></div>
    </div>
    <canvas id="canvas" width="480" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">CYBER BREAKOUT</h2>
      <p id="ov-desc">Mouse / Arrows: Move Paddle · Space: Launch</p>
      <button class="btn" id="start-btn">LAUNCH BALL</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const startBtn = document.getElementById('start-btn');

    let paddle = { x: 200, y: 395, width: 85, height: 12, speed: 7 };
    let balls = [];
    let bricks = [];
    let particles = [];
    let powerups = [];
    let score = 0;
    let lives = 3;
    let level = 1;
    let isPlaying = false;
    let ballAttached = true;

    const ROW_COUNT = 5;
    const COL_COUNT = 8;
    const BRICK_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4'];

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, dur) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function initBricks() {
      bricks = [];
      const brickWidth = 52;
      const brickHeight = 16;
      const padding = 6;
      const offsetTop = 40;
      const offsetLeft = (canvas.width - (COL_COUNT * (brickWidth + padding) - padding)) / 2;

      for (let c = 0; c < COL_COUNT; c++) {
        for (let r = 0; r < ROW_COUNT; r++) {
          bricks.push({
            x: offsetLeft + c * (brickWidth + padding),
            y: offsetTop + r * (brickHeight + padding),
            w: brickWidth,
            h: brickHeight,
            status: 1,
            color: BRICK_COLORS[r % BRICK_COLORS.length],
            points: (ROW_COUNT - r) * 10
          });
        }
      }
    }

    function resetBall() {
      ballAttached = true;
      balls = [{
        x: paddle.x + paddle.width / 2,
        y: paddle.y - 8,
        vx: 3.5,
        vy: -3.5,
        radius: 6
      }];
    }

    function init() {
      score = 0;
      lives = 3;
      level = 1;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      levelEl.textContent = '1';
      paddle.width = 85;
      paddle.x = canvas.width / 2 - paddle.width / 2;
      particles = [];
      powerups = [];
      initBricks();
      resetBall();
      isPlaying = true;
      overlay.style.display = 'none';
    }

    function launch() {
      if (ballAttached) {
        ballAttached = false;
        playBeep(440, 0.08);
      }
    }

    function addExplosion(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 3 + 1,
          color,
          life: 1
        });
      }
    }

    function update() {
      if (!isPlaying) return;

      if (ballAttached) {
        balls[0].x = paddle.x + paddle.width / 2;
        balls[0].y = paddle.y - 7;
      } else {
        // Move balls
        for (let i = balls.length - 1; i >= 0; i--) {
          const b = balls[i];
          b.x += b.vx;
          b.y += b.vy;

          // Wall Bounce
          if (b.x + b.radius > canvas.width) { b.x = canvas.width - b.radius; b.vx *= -1; playBeep(260, 0.03); }
          if (b.x - b.radius < 0) { b.x = b.radius; b.vx *= -1; playBeep(260, 0.03); }
          if (b.y - b.radius < 0) { b.y = b.radius; b.vy *= -1; playBeep(260, 0.03); }

          // Paddle Bounce
          if (
            b.y + b.radius >= paddle.y &&
            b.y - b.radius <= paddle.y + paddle.height &&
            b.x >= paddle.x &&
            b.x <= paddle.x + paddle.width &&
            b.vy > 0
          ) {
            const hitPoint = (b.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
            b.vx = hitPoint * 5.5;
            b.vy = -Math.abs(b.vy);
            playBeep(330, 0.04);
          }

          // Brick collision
          bricks.forEach(brick => {
            if (brick.status === 1) {
              if (
                b.x + b.radius > brick.x &&
                b.x - b.radius < brick.x + brick.w &&
                b.y + b.radius > brick.y &&
                b.y - b.radius < brick.y + brick.h
              ) {
                brick.status = 0;
                b.vy *= -1;
                score += brick.points;
                scoreEl.textContent = score;
                addExplosion(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color);
                playBeep(520, 0.06);

                // Chance to drop power-up
                if (Math.random() < 0.2) {
                  powerups.push({
                    x: brick.x + brick.w / 2,
                    y: brick.y + brick.h,
                    type: Math.random() < 0.5 ? 'wide' : 'life'
                  });
                }
              }
            }
          });

          // Ball fell out
          if (b.y - b.radius > canvas.height) {
            balls.splice(i, 1);
          }
        }

        if (balls.length === 0) {
          lives--;
          livesEl.textContent = lives;
          playBeep(180, 0.2);
          if (lives <= 0) {
            gameOver();
          } else {
            resetBall();
          }
        }
      }

      // Power-ups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += 2;
        if (
          p.y >= paddle.y &&
          p.y <= paddle.y + paddle.height &&
          p.x >= paddle.x &&
          p.x <= paddle.x + paddle.width
        ) {
          if (p.type === 'wide') {
            paddle.width = Math.min(130, paddle.width + 25);
          } else if (p.type === 'life') {
            lives++;
            livesEl.textContent = lives;
          }
          playBeep(680, 0.1);
          powerups.splice(i, 1);
        } else if (p.y > canvas.height) {
          powerups.splice(i, 1);
        }
      }

      // Check level clear
      if (bricks.every(b => b.status === 0)) {
        level++;
        levelEl.textContent = level;
        playBeep(880, 0.25);
        initBricks();
        resetBall();
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.03;
        if (pt.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      bricks.forEach(b => {
        if (b.status === 1) {
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, b.h, 3);
          ctx.fill();
        }
      });

      // Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Balls
      ctx.fillStyle = '#ffffff';
      balls.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Power-ups
      powerups.forEach(p => {
        ctx.fillStyle = p.type === 'wide' ? '#22c55e' : '#f43f5e';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
        ctx.fill();
      });

      // Particles
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.life);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isPlaying = false;
      ovTitle.textContent = 'GAME OVER';
      ovDesc.textContent = `Final Score: ${score} · Level: ${level}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    // Input
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, mouseX - paddle.width / 2));
    });

    canvas.addEventListener('click', launch);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        launch();
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        paddle.x = Math.max(0, paddle.x - 25);
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        paddle.x = Math.min(canvas.width - paddle.width, paddle.x + 25);
      }
    });

    startBtn.addEventListener('click', () => {
      init();
    });

    init();
    isPlaying = false;
    overlay.style.display = 'flex';
    loop();
  </script>
</body>
</html>
