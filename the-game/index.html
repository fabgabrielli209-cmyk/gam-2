<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cookie Clicker Classic v.0.125</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2b1d12;
            color: #fff;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        #section-left {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 300px;
            background-color: #1c120b;
            border-right: 2px solid #54371a;
            text-align: center;
            padding-top: 20px;
        }
        #section-right {
            position: absolute;
            left: 302px; top: 0; bottom: 0; right: 0;
            background-color: #3a2718;
            overflow-y: auto;
            padding: 20px;
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #ccc;
            text-shadow: 0px 2px #000;
        }
        #cookie-balance-box {
            background-color: rgba(0,0,0,0.4);
            padding: 10px;
            margin: 15px 20px;
            border-radius: 8px;
            border: 1px solid #442a14;
        }
        #cookie-display {
            font-size: 24px;
            font-weight: bold;
        }
        #cps-display {
            font-size: 14px;
            color: #b3b3b3;
            margin-top: 4px;
        }
        #cookie-anchor {
            margin-top: 40px;
            display: inline-block;
            cursor: pointer;
            width: 200px;
            height: 200px;
            background-color: #df9e5a;
            border: 8px solid #865325;
            border-radius: 50%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6), inset 0 -10px 20px rgba(0,0,0,0.4);
            position: relative;
            transition: transform 0.05s;
        }
        #cookie-anchor:active {
            transform: scale(0.96);
        }
        #cookie-anchor::before {
            content: "COOKIE";
            position: absolute;
            left: 0; right: 0; top: 85px;
            font-size: 24px;
            font-weight: bold;
            color: #54371a;
            letter-spacing: 2px;
        }
        .chip {
            position: absolute;
            width: 16px;
            height: 12px;
            background-color: #4a2f16;
            border-radius: 4px;
        }
        .shop-header {
            font-size: 24px;
            font-weight: bold;
            color: #eebb77;
            border-bottom: 2px solid #54371a;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .store-row {
            background-color: #23170e;
            border: 1px solid #54371a;
            border-radius: 6px;
            margin-bottom: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .store-row:hover {
            background-color: #2d1e12;
            border-color: #7a5229;
        }
        .store-row.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .item-name {
            font-size: 18px;
            font-weight: bold;
        }
        .item-desc {
            font-size: 12px;
            color: #b3b3b3;
            margin-top: 2px;
        }
        .item-cost {
            font-size: 16px;
            font-weight: bold;
            color: #61df61;
        }
        .item-qty {
            font-size: 24px;
            font-weight: bold;
            color: rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>

    <div id="section-left">
        <div class="title">Cookie Clicker</div>
        <div style="font-size:11px; color:#888;">Classic Edition</div>
        
        <div id="cookie-balance-box">
            <div id="cookie-display">0 cookies</div>
            <div id="cps-display">cps: 0</div>
        </div>

        <div id="cookie-anchor" onclick="Game.Earn(1)">
            <div class="chip" style="left:30px; top:40px;"></div>
            <div class="chip" style="left:120px; top:30px;"></div>
            <div class="chip" style="left:75px; top:80px;"></div>
            <div class="chip" style="left:40px; top:130px;"></div>
            <div class="chip" style="left:130px; top:120px;"></div>
        </div>
    </div>

    <div id="section-right">
        <div class="shop-header">Store</div>
        <div id="store-shelf"></div>
    </div>

    <script>
        const Game = {
            cookies: 0,
            cps: 0,
            
            items: [
                { id: 'cursor', name: 'Cursor', cost: 15, baseCost: 15, cps: 0.1, count: 0, desc: 'Autoclicks once every 10 seconds.' },
                { id: 'grandma', name: 'Grandma', cost: 100, baseCost: 100, cps: 1, count: 0, desc: 'A nice grandma to bake more cookies.' },
                { id: 'farm', name: 'Farm', cost: 1100, baseCost: 1100, cps: 8, count: 0, desc: 'Grows cookie plants from cookie seeds.' },
                { id: 'factory', name: 'Factory', cost: 12000, baseCost: 12000, cps: 47, count: 0, desc: 'Mass-produces cookies in assembly lines.' },
                { id: 'mine', name: 'Mine', cost: 130000, baseCost: 130000, cps: 260, count: 0, desc: 'Mines cookie dough from the earth.' },
                { id: 'shipment', name: 'Shipment', cost: 1400000, baseCost: 1400000, cps: 1400, count: 0, desc: 'Brings fresh cookies from the cookie planet.' },
                { id: 'lab', name: 'Alchemy Lab', cost: 20000000, baseCost: 20000000, cps: 7800, count: 0, desc: 'Transmutes gold directly into cookies.' }
            ],

            init: function() {
                this.buildStore();
                this.load();

                setInterval(() => {
                    if (this.cps > 0) this.Earn(this.cps / 30);
                }, 1000 / 30);

                setInterval(() => this.save(), 5000);
            },

            buildStore: function() {
                const shelf = document.getElementById('store-shelf');
                shelf.innerHTML = '';
                this.items.forEach((item, index) => {
                    const row = document.createElement('div');
                    row.className = 'store-row';
                    row.id = `item-row-${item.id}`;
                    row.onclick = () => this.Buy(index);
                    row.innerHTML = `
                        <div>
                            <div class="item-name">${item.name}</div>
                            <div class="item-desc">${item.desc}</div>
                            <div class="item-cost" id="cost-${item.id}">${item.cost} cookies</div>
                        </div>
                        <div class="item-qty" id="qty-${item.id}">0</div>
                    `;
                    shelf.appendChild(row);
                });
            },

            Earn: function(amount) {
                this.cookies += amount;
                this.updateUI();
            },

            Buy: function(index) {
                const item = this.items[index];
                if (this.cookies >= item.cost) {
                    this.cookies -= item.cost;
                    item.count++;
                    item.cost = Math.floor(item.baseCost * Math.pow(1.15, item.count));
                    this.recalcCPS();
                    this.updateUI();
                }
            },

            recalcCPS: function() {
                this.cps = this.items.reduce((total, i) => total + (i.count * i.cps), 0);
            },

            updateUI: function() {
                document.getElementById('cookie-display').textContent = `${Math.floor(this.cookies).toLocaleString()} cookies`;
                document.getElementById('cps-display').textContent = `cps: ${this.cps.toFixed(1)}`;

                this.items.forEach(item => {
                    const row = document.getElementById(`item-row-${item.id}`);
                    const qtyNode = document.getElementById(`qty-${item.id}`);
                    const costNode = document.getElementById(`cost-${item.id}`);
                    
                    if (row && qtyNode && costNode) {
                        qtyNode.textContent = item.count;
                        costNode.textContent = `${item.cost.toLocaleString()} cookies`;
                        if (this.cookies >= item.cost) row.classList.remove('disabled');
                        else row.classList.add('disabled');
                    }
                });
            },

            save: function() {
                const data = {
                    cookies: this.cookies,
                    counts: this.items.map(i => i.count),
                    costs: this.items.map(i => i.cost)
                };
                localStorage.setItem('orteil_genuine_retro_save', JSON.stringify(data));
            },

            load: function() {
                const raw = localStorage.getItem('orteil_genuine_retro_save');
                if (raw) {
                    try {
                        const data = JSON.parse(raw);
                        this.cookies = data.cookies || 0;
                        this.items.forEach((item, idx) => {
                            if(data.counts && data.counts[idx] !== undefined) item.count = data.counts[idx];
                            if(data.costs && data.costs[idx] !== undefined) item.cost = data.costs[idx];
                        });
                        this.recalcCPS();
                        this.updateUI();
                    } catch(e) {}
                }
            }
        };

        window.onload = () => Game.init();
    </script>
</body>
</html>
